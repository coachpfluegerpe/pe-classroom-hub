<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PE Interactive Classroom Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef4f2;color:#17332d}header{background:white;padding:16px 22px;border-bottom:2px solid #c8d9d4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}main{max-width:1200px;margin:auto;padding:20px}button{font:inherit;color:inherit;cursor:pointer}.home{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.tile,.btn,.choice{background:white;border:2px solid #c8d9d4;border-radius:18px;font-weight:800}.tile{min-height:140px;padding:15px;font-size:18px}.tile b{display:block;font-size:44px;margin-bottom:8px}.btn{min-height:55px;padding:10px 18px}.panel{background:white;border:2px solid #c8d9d4;border-radius:22px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.result{margin:18px 0;padding:25px;border:2px solid #c8d9d4;border-radius:18px;text-align:center;font-size:28px;font-weight:900;background:#f8fbfa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{min-height:95px;padding:12px;font-size:18px}.selected,.done{outline:4px solid #267563;background:#dcece7}.zones{display:grid;grid-template-columns:1fr 1fr;gap:14px}.zone{min-height:230px;border:3px solid #c8d9d4;border-radius:18px;padding:10px;background:#f8fbfa}.zone h2{text-align:center}.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bank button,.chip{min-height:65px;border:2px solid #c8d9d4;border-radius:14px;background:white;font-weight:bold}.chip{width:100%;margin:5px 0}.breath{width:140px;height:140px;border-radius:50%;background:#a9d2c7;margin:25px auto;display:flex;align-items:center;justify-content:center;font-weight:bold;transition:transform 4s}.grow{transform:scale(1.5)}.hidden{display:none}.note{text-align:center;color:#5b6f69}.primary{background:#267563;color:white;border-color:#267563}
@media(max-width:900px){.home{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.home{grid-template-columns:repeat(2,1fr)}.grid,.bank{grid-template-columns:repeat(2,1fr)}.two,.zones{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.breath{transition:none}}
</style></head><body>
<header><div><div style="font-size:30px;font-weight:900">🏃 PE Interactive Classroom Hub</div><div>Movement • Choice • Regulation • Visual Supports</div></div><button class="btn" id="homeBtn">🏠 Home</button></header>
<main><section id="home"><p class="note">Choose an activity.</p><div class="home" id="menu"></div></section><section id="screen" class="hidden"></section></main>
<script>
(()=>{const H=document.querySelector('#home'),S=document.querySelector('#screen'),M=document.querySelector('#menu');let timer=null;
const menu=[['🔥','Warm-Up Wheel','wheel'],['🎲','Movement Dice','dice'],['🎯','Fitness Bingo','bingo'],['🤔','Would You Rather?','wyr'],['🗺️','PE Adventure','adv'],['🏀','Sports Skills','sports'],['⭐','Choice Activity','choice'],['➡️','First → Then','ft'],['🌿','Calming Corner','calm'],['🧘','Cool Down','cool']];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function home(){if(timer)clearTimeout(timer);S.classList.add('hidden');H.classList.remove('hidden');S.innerHTML=''}homeBtn.onclick=home;
function shell(title,body){H.classList.add('hidden');S.classList.remove('hidden');S.innerHTML='<div class="panel"><div class="top"><button class="btn" id="ih">🏠 PE Home</button><h1>'+title+'</h1><button class="btn" id="reset">↻ Reset</button></div>'+body+'</div>';ih.onclick=home}
menu.forEach(x=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<b>'+x[0]+'</b>'+x[1];b.onclick=()=>open(x[2],x[1]);M.appendChild(b)});
function open(t,title){
if(timer)clearTimeout(timer);
if(t==='wheel'){shell(title,'<div class="result" id="r">Tap SPIN to choose a warm-up!</div><button class="btn primary" style="width:100%" id="go">🎡 SPIN</button>');let a=['🏃 Jog in Place — 20 sec','🤸 10 Jumping Jacks','🦩 Balance — 10 sec each foot','🧱 10 Wall Pushes','🚶 High-Knee March — 20 sec','🙆 Reach & Stretch','🐻 10 Slow Bear Steps','⭐ Student Choice'];go.onclick=()=>r.textContent=pick(a)}
if(t==='dice'){shell(title,'<div class="result" id="r">🎲 + 🎲</div><button class="btn primary" style="width:100%" id="go">ROLL BOTH DICE</button>');let a=['Squats','Toe Touches','High Knees','Arm Circles','Side Steps','Balance Seconds','Wall Pushes','Marches'],n=[5,6,8,10,12,15,20];go.onclick=()=>r.innerHTML='🎲 '+pick(a)+'<br>🎲 '+pick(n)}
if(t==='bingo'){shell(title,'<p class="note">Complete an activity, then tap its square.</p><div class="grid" id="g"></div>');['10 Squats','Balance 10 sec','10 Wall Pushes','March 20 sec','5 Star Jumps','Stretch Tall','10 Side Steps','Arm Circles','Student Choice'].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>b.classList.toggle('done');g.appendChild(b)})}
if(t==='wyr'){shell(title,'<div class="result">Would you rather…</div><div class="two"><button class="choice" id="a"></button><button class="choice" id="b"></button></div><button class="btn primary" style="width:100%;margin-top:12px" id="go">NEW QUESTION</button>');let q=[['🐆 Move FAST like a cheetah','🐢 Move SLOW like a turtle'],['🏀 Dribble a basketball','⚽ Dribble a soccer ball'],['🦘 Jump like a kangaroo','🦩 Balance like a flamingo'],['🚀 Move in space','🌊 Move under the ocean'],['🐻 Bear walk','🦀 Crab walk']];function show(){let x=pick(q);a.textContent=x[0];b.textContent=x[1]}show();go.onclick=show;[a,b].forEach(x=>x.onclick=()=>{a.classList.remove('selected');b.classList.remove('selected');x.classList.add('selected')})}
if(t==='adv'){let q=[['🌲','Enter the Forest','March quietly for 20 seconds.'],['🌉','Cross the Bridge','Balance heel-to-toe for 10 steps.'],['🪵','Jump the Logs','Do 8 controlled jumps.'],['🕳️','Explore the Cave','Do 8 slow bear steps.'],['⛰️','Climb the Mountain','Do 10 high-knee marches.'],['🏕️','Reach Base Camp','Take 3 slow breaths and stretch tall.']],i=0;shell(title,'<div class="result" id="r"></div><button class="btn primary" style="width:100%" id="go">NEXT ADVENTURE →</button>');function show(){r.innerHTML='<div style="font-size:50px">'+q[i][0]+'</div>'+q[i][1]+'<div style="font-size:18px;margin-top:8px">'+q[i][2]+'</div>'}show();go.onclick=()=>{i=(i+1)%q.length;show()}}
if(t==='sports'){shell(title,'<div class="grid" id="g"></div><div class="result" id="r">Choose a sport.</div>');[['🏀 Basketball',['10 controlled dribbles','Dribble right → left','Chest-pass practice']],['⚽ Soccer',['10 toe taps','Inside-foot dribble','Trap and control']],['🏐 Volleyball',['10 self bumps','Ready-position practice','Bump to a partner']],['🏈 Football',['Target throw','Quick-feet pattern','Catch and tuck']]].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x[0];b.onclick=()=>r.textContent=pick(x[1]);g.appendChild(b)})}
if(t==='choice'){shell(title,'<div class="result" id="r">Tap CHOOSE for today’s activity.</div><button class="btn primary" style="width:100%" id="go">⭐ CHOOSE ACTIVITY</button>');let a=['🏀 Basketball','🏈 Football','⚽ Soccer','🛴 Scooters','🏐 Volleyball','🚶 Movement Station','⭐ Teacher Choice'];go.onclick=()=>r.textContent=pick(a)}
if(t==='ft'){shell(title,'<p class="note">Tap an activity, then place it under FIRST or THEN. Tap a placed card to remove it.</p><div class="bank" id="bank"></div><div class="zones" style="margin-top:14px"><div class="zone"><h2>1️⃣ FIRST</h2><div id="fz"></div></div><div class="zone"><h2>2️⃣ THEN</h2><div id="tz"></div></div></div><div class="two" style="margin-top:12px"><button class="btn" id="mf">← FIRST</button><button class="btn" id="mt">THEN →</button></div>');let sel=null;[['🤸','Movement Warm-Up'],['🏃','Locomotor Activity'],['🧘','Break'],['⚽','1st Sport Activity'],['🏀','2nd Activity'],['⭐','Choice Activity'],['💧','Water Break'],['🌿','Cooldown Activity']].forEach(x=>{let b=document.createElement('button');b.textContent=x[0]+' '+x[1];b.onclick=()=>sel=x;bank.appendChild(b)});function add(z){if(!sel)return;let b=document.createElement('button');b.className='chip';b.textContent=sel[0]+' '+sel[1];b.onclick=()=>b.remove();z.appendChild(b)}mf.onclick=()=>add(fz);mt.onclick=()=>add(tz)}
if(t==='calm'){shell(title,'<p class="note">There is no wrong answer. Choose what feels closest right now.</p><div class="two" id="feel"><button class="choice">🟢 Calm / Ready</button><button class="choice">🟡 Worried / Wiggly</button><button class="choice">🔴 Angry / Overloaded</button><button class="choice">🔵 Tired / Sad</button></div><div class="result" style="font-size:22px">Choose a reset</div><div class="grid"><button class="choice">🧱 Wall Pushes</button><button class="choice">🙆 Slow Stretch</button><button class="choice">🚶 Slow March</button><button class="choice">🐢 Turtle Curl</button><button class="choice">🦩 Balance</button><button class="choice" id="breath">🌬️ Balloon Breathing</button></div><div id="ba"></div><button class="btn" style="width:100%;margin-top:15px" id="teacher">✋ I Need My Teacher</button><div class="result hidden" id="tm" style="font-size:20px">Stay here and show this screen to your teacher.</div>');document.querySelectorAll('#feel button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#feel button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});breath.onclick=()=>{ba.innerHTML='<div class="breath" id="bc">BREATHE IN</div>';let p=0;function go(){if(p>=6){bc.classList.remove('grow');bc.textContent='DONE';return}if(p%2===0){bc.classList.add('grow');bc.textContent='BREATHE IN'}else{bc.classList.remove('grow');bc.textContent='BREATHE OUT'}p++;timer=setTimeout(go,4000)}go()};teacher.onclick=()=>tm.classList.toggle('hidden')}
if(t==='cool'){shell(title,'<div class="result" id="r">🌿 Choose a gentle cool-down.</div><div class="grid" id="g"></div>');['🙆 Reach Tall','🦋 Butterfly Stretch','🦩 Balance & Breathe','🌬️ 3 Slow Breaths','💪 Shoulder Stretch','🧘 Quiet Body Check'].forEach(x=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{document.querySelectorAll('#g button').forEach(y=>y.classList.remove('selected'));b.classList.add('selected');r.textContent='Nice choice. Hold gently and breathe slowly.'};g.appendChild(b)})}
let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>open(t,title)
}})();
</script></body></html>
